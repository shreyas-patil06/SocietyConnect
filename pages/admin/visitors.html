<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitors &amp; Logs — SocietyConnect</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="app-sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="app-topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Society Visitor Passes &amp; Gate Logs</h1>
              <p class="page-subtitle">Monitor active guest passes and audit all gate entries and exits.</p>
            </div>
          </div>

          <div class="card" style="margin-bottom:20px;">
            <div class="card-header">
              <h2 class="card-title">Guest Passes</h2>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Guest</th>
                    <th>Flat &amp; Host</th>
                    <th>Pass Type &amp; Purpose</th>
                    <th>Expires</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="admin-passes-tbody">
                  <tr><td colspan="6" class="empty-state">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Visitor Entry &amp; Exit Audit Logs</h2>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Visitor</th>
                    <th>Flat</th>
                    <th>Method</th>
                    <th>Guard</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="admin-logs-tbody">
                  <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/admin/visitors.js"></script>
  </body>
</html>
