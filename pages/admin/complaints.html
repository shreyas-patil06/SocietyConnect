<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Complaints — SocietyConnect</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="app-sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="app-topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Society Complaints Management</h1>
              <p class="page-subtitle">Assign maintenance staff, prioritize tickets, and monitor resolution.</p>
            </div>
            <div class="page-actions">
              <select id="admin-comp-status-filter" class="form-control" style="width:auto;">
                <option value="all">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Complaint &amp; Resident</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Assigned Staff</th>
                    <th>Photo</th>
                    <th>Logged</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="admin-complaints-tbody">
                  <tr><td colspan="8" class="empty-state">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="assign-complaint-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Assign Complaint &amp; Set Priority</h3>
          <button id="close-assign-modal" type="button" class="modal-close">✕</button>
        </div>
        <div id="assign-modal-alert"></div>
        <p id="assign-comp-title" style="font-weight:600;color:#2563EB;margin-bottom:14px;"></p>
        <form id="assign-complaint-form">
          <input id="assign-comp-id" type="hidden" />
          <div class="form-group">
            <label class="form-label" for="assign-staff-select">Assign Maintenance Staff</label>
            <select id="assign-staff-select" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="assign-priority">Priority</label>
            <select id="assign-priority" class="form-control">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="assign-notes">Instructions for Staff</label>
            <textarea id="assign-notes" class="form-control" placeholder="Optional notes or instructions..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Assign Ticket</button>
        </form>
      </div>
    </div>

    <script type="module" src="/js/admin/complaints.js"></script>
  </body>
</html>
