<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications — SocietyConnect</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="app-sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="app-topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Notifications</h1>
              <p class="page-subtitle">Real-time updates for visitors, complaints, bills, and emergencies.</p>
            </div>
            <div class="page-actions">
              <select id="notif-filter" class="form-control" style="width:auto;">
                <option value="all">All Notifications</option>
                <option value="unread">Unread Only</option>
              </select>
              <button id="mark-all-page-btn" type="button" class="btn btn-outline">Mark All Read</button>
            </div>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Type</th>
                    <th>Message</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="notifications-tbody">
                  <tr><td colspan="5" class="empty-state">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/resident/notifications.js"></script>
  </body>
</html>
