<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergency SOS — SocietyConnect</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/resident.css" />
  </head>
  <body data-page="resident-emergency">
    <div class="app-shell">
      <aside id="app-sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="app-topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Emergency Response SOS</h1>
              <p class="page-subtitle">Immediately notify all on-duty security guards and society admins.</p>
            </div>
          </div>

          <section class="bento-grid">
            <div class="bento-col">
              <div class="card">
                <div class="card-header">
                  <h2 class="card-title">My Emergency Alert History</h2>
                </div>
                <div class="table-wrap">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th>Emergency &amp; Details</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Responder</th>
                        <th>Triggered At</th>
                      </tr>
                    </thead>
                    <tbody id="emergency-history-tbody">
                      <tr><td colspan="5" class="empty-state">Loading...</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="bento-col">
              <div class="card sos-banner-card">
                <div class="card-header">
                  <div>
                    <h2 class="card-title" style="color:#DC2626;">Trigger Emergency Alert</h2>
                    <p class="card-subtitle">Dispatches your name and flat number instantly</p>
                  </div>
                </div>
                <div id="emergency-alert"></div>
                <form id="emergency-form">
                  <div class="form-group">
                    <label class="form-label" for="em-type">Emergency Type</label>
                    <select id="em-type" class="form-control" required>
                      <option value="Medical">Medical Emergency</option>
                      <option value="Fire">Fire / Smoke</option>
                      <option value="Security Threat">Security Threat / Intruder</option>
                      <option value="Lift Stuck">Lift Stuck</option>
                      <option value="Gas Leak">Gas Leak</option>
                      <option value="Other">Other Urgent Help</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="em-severity">Severity</label>
                    <select id="em-severity" class="form-control">
                      <option value="Critical" selected>Critical (Immediate Dispatch)</option>
                      <option value="High">High Priority</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="em-details">Emergency Details</label>
                    <textarea id="em-details" class="form-control" placeholder="Describe what assistance is needed..." required></textarea>
                  </div>
                  <button id="emergency-submit-btn" type="submit" class="btn btn-danger" style="width:100%;">
                    Trigger Emergency Alert
                  </button>
                </form>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/js/resident/dashboard.js"></script>
  </body>
</html>
