<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assigned Complaints — SocietyConnect</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body data-page="staff-assigned">
    <div class="app-shell">
      <aside id="app-sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="app-topbar" class="topbar"></header>
        <main class="page-content">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Assigned Complaints</h1>
              <p class="page-subtitle">Accept tickets, log repair updates, and mark complaints resolved.</p>
            </div>
            <div class="page-actions">
              <select id="staff-status-filter" class="form-control" style="width:auto;">
                <option value="all">All Statuses</option>
                <option value="Assigned">Assigned (New)</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
              </select>
            </div>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Complaint &amp; Flat</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Progress Notes</th>
                    <th>Updated</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="staff-complaints-tbody">
                  <tr><td colspan="7" class="empty-state">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="staff-update-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Update Repair Progress</h3>
          <button id="close-staff-modal" type="button" class="modal-close">✕</button>
        </div>
        <div id="staff-modal-alert"></div>
        <p id="upd-comp-title" style="font-weight:600;color:#2563EB;margin-bottom:14px;"></p>
        <form id="staff-update-form">
          <input id="upd-comp-id" type="hidden" />
          <div class="form-group">
            <label class="form-label" for="upd-status">Ticket Status</label>
            <select id="upd-status" class="form-control">
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="upd-notes">Work Progress / Resolution Notes</label>
            <textarea id="upd-notes" class="form-control" placeholder="Describe work completed or parts replaced..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Save Progress Update</button>
        </form>
      </div>
    </div>

    <script type="module" src="/js/staff/complaints.js"></script>
  </body>
</html>
